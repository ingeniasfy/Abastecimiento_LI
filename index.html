<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#F7F6F2;--card:#FFFFFF;--ink:#0B1D3A;--mute:#6b7691;--line:#E4E8EF;--brand:#2E6FF2;--brand-ink:#fff;--navy:#0B1D3A;--sky:#8FD4FF;--ok:#15803d;--ok-bg:#dcfce7;--warn:#92400e;--warn-bg:#fef3c7;--err:#dc2626;--err-bg:#fee2e2;--info-bg:#E6F1FF;--chip:#EEF1F6;--shadow:0 1px 2px rgba(11,29,58,.08),0 6px 20px rgba(11,29,58,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#081428;--card:#0F2447;--ink:#E8EEF8;--mute:#93a1bd;--line:#1E3562;--brand:#4C86F5;--brand-ink:#fff;--navy:#06101f;--sky:#8FD4FF;--ok:#4ade80;--ok-bg:#12301d;--warn:#fcd34d;--warn-bg:#3a2f0b;--err:#f87171;--err-bg:#3b1517;--info-bg:#10305c;--chip:#16305a;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:'Bebas Neue','Inter',sans-serif;font-weight:400;letter-spacing:1.5px}h2{font-size:25px}h3{font-size:19px;letter-spacing:1px}
.mute{color:var(--mute)}.small{font-size:12.5px}.b{font-weight:600}.right{text-align:right}
/* pantallas de arranque */
#boot,#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
.login-card{text-align:center}.login-card h1{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;letter-spacing:-.01em;margin:6px 0 2px}.login-card form,.login-card label{text-align:left}
.mark{width:44px;height:44px;overflow:visible}.mark polygon{fill:var(--sky)}.mark polygon:nth-child(3){fill:var(--brand)}
/* barra superior */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;letter-spacing:-.01em;color:#fff}.brand .mark{width:26px;height:26px}.brand span{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:var(--sky);margin-left:2px;letter-spacing:0}
.top{background:var(--navy);border-bottom:0;color:#fff}.top .b{color:#fff}.top .badge,.top .badge.info{background:rgba(143,212,255,.18);color:var(--sky)}.top #who-rol{background:rgba(255,255,255,.12);color:#fff}.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}.top .btn:hover{border-color:var(--sky)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--chip);font-size:12px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.err{background:var(--err-bg);color:var(--err)}.badge.info{background:var(--info-bg)}
.mainnav{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
.mainnav button{border:0;background:transparent;padding:8px 12px;border-radius:10px;white-space:nowrap;color:var(--mute);cursor:pointer}
.mainnav button.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.mainnav button:disabled{opacity:.55;cursor:default}
/* configuración */
.cfg{display:grid;grid-template-columns:230px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
.cfg-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:112px;align-self:start}
.cfg-nav button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer}
.cfg-nav button.on{background:var(--card);border-color:var(--line);font-weight:600;box-shadow:var(--shadow)}
.cfg-nav .ico{width:22px;text-align:center}
.cfg-body{min-width:0}
@media (max-width:760px){
 .cfg{display:block;padding:10px 12px 90px}
 .cfg-nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:8px;margin-bottom:8px;gap:6px}
 .cfg-nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);padding:9px 12px}
 .cfg-nav .ico{display:none}
 .brand span{display:none}
 .top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));gap:6px}
 .who{gap:5px}#who-rol{display:none}
 .who .btn.sm{min-height:30px;padding:4px 9px;font-size:12px}
 .mainnav{padding:6px 10px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin-bottom:6px}
.sec-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head .t{flex:1;min-width:200px}.sec-head p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input,.tools select{flex:1;min-width:130px}
/* botones y campos */
.btn{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px;font-weight:500}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.link{border:0;background:transparent;color:var(--brand);padding:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=email],input[type=date],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label.f{display:block;margin-bottom:12px}
label.f>.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
label.f>.hint{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.tgl{display:flex;align-items:center;gap:10px;min-height:44px}.tgl input{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;cursor:pointer;min-height:36px}
.chipbtn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 8px;font-size:12.5px;margin:2px 4px 2px 0}
/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--mute)}
.item .main{flex:1;min-width:0}.item .name{font-weight:600;overflow-wrap:anywhere}
.item.off{opacity:.55}
.empty{padding:26px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
/* avisos */
.msg{border-radius:10px;padding:9px 12px;margin:8px 0;font-size:13.5px}
.msg.e{background:var(--err-bg);color:var(--err)}.msg.w{background:var(--warn-bg);color:var(--warn)}.msg.i{background:var(--info-bg)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg ul{margin:4px 0 0;padding-left:18px}
/* hoja de edición */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.4);pointer-events:auto;animation:fade .15s}
.sheet{position:absolute;pointer-events:auto;background:var(--card);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (max-width:760px){.sheet{left:0;right:0;bottom:0;max-height:94vh;border-radius:18px 18px 0 0;animation:up .2s}}
@media (min-width:761px){.sheet{top:0;right:0;bottom:0;width:560px;max-width:96vw;animation:left .2s}}
.sheet header{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header .t{flex:1}.sheet header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.sheet .body{padding:14px 16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet footer{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--card)}
.sheet.wide{width:760px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes left{from{transform:translateX(40px);opacity:.4}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;border-radius:12px;padding:10px 16px;max-width:92vw;box-shadow:var(--shadow);pointer-events:auto}
.toast.err{background:#991b1b}
/* tablas simples */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--mute);font-weight:600}
.scroll-x{overflow-x:auto}
.tbl input,.tbl select{min-height:36px;padding:5px 8px}
.diff{font-size:13px}.diff .a{text-decoration:line-through;color:var(--mute)}.diff .d{font-weight:600}
.perm-g{margin:10px 0 4px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.perm-row{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line)}
.perm-row input{width:20px;height:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.conteo-in{width:104px;text-align:right;font-weight:600;font-size:16px}
.cnt-row.lv-critico{border-left:4px solid var(--err)}.cnt-row.lv-reponer{border-left:4px solid #d97706}
.ok-t{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.tr-crit td{background:var(--err-bg)}
.msgbox{white-space:pre-wrap;margin:0;font:inherit;background:var(--chip);border-radius:10px;padding:10px 12px}
details.card summary{font-weight:600}
@media (max-width:760px){.conteo-in{width:92px}}
/* ===== MAGNUS SPLASH (igual al del menú digital y el POS) ===== */
:root{--mg-navy:#0B1D3A;--mg-blue:#2E6FF2;--mg-sky:#8FD4FF;--mg-white:#ffffff;--mg-ease:cubic-bezier(0.16,1,0.3,1)}
.mg-splash{position:fixed;inset:0;z-index:9999;width:100%;min-height:100vh;background:var(--mg-navy);font-family:'Inter',system-ui,sans-serif;box-sizing:border-box;padding:0 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mg-mark{width:72px;height:72px;overflow:visible;margin-bottom:22px}
.mg-mark polygon{fill:var(--mg-sky);transform-box:fill-box;transform-origin:bottom;animation:mg-bar-grow .6s var(--mg-ease) backwards,mg-bar-pulse 2.6s ease-in-out infinite}
.mg-mark polygon:nth-child(1){animation-delay:.10s,.90s}.mg-mark polygon:nth-child(2){animation-delay:.25s,1.05s}
.mg-mark polygon:nth-child(3){animation-delay:.40s,1.20s;fill:var(--mg-blue)}.mg-mark polygon:nth-child(4){animation-delay:.55s,1.35s}
.mg-wordmark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;letter-spacing:-0.01em;color:var(--mg-white);opacity:0;animation:mg-up-16 .7s var(--mg-ease) .7s forwards}
.mg-tagline{font-size:14px;line-height:1.5;color:var(--mg-sky);text-align:center;margin:10px 0 0;opacity:0;animation:mg-up-16 .7s var(--mg-ease) .85s forwards}
@keyframes mg-bar-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes mg-bar-pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}
@keyframes mg-up-16{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.mg-splash.mg-fade{opacity:0;transition:opacity .5s ease}
@media (prefers-reduced-motion:reduce){.mg-mark polygon,.mg-wordmark,.mg-tagline{animation:none;opacity:1;transform:none}}
@media print{.top,.mainnav,.cfg-nav,.tools,.btn{display:none!important}}
</style>

<script>
  // El splash se quita cuando la página ya está lista (pantalla de entrada o módulo), después de que
  // se vea la animación mínima; y como tope de seguridad a los 8 s, para no tapar un mensaje de error.
  (function(){
    var ini = Date.now(), listo = false;
    function quitar(){
      if(listo) return; listo = true;
      var el = document.getElementById('mg-splash'); if(!el) return;
      el.classList.add('mg-fade'); setTimeout(function(){ el.remove(); }, 500);
    }
    var t = setInterval(function(){
      var boot = document.getElementById('boot'), edad = Date.now() - ini;
      if((boot && boot.hidden && edad >= 1300) || edad >= 8000){ clearInterval(t); quitar(); }
    }, 120);
  })();
</script>

function crearMemoria() {
  const key = "abast_demo_" + NEG;
  let db = {};
  if (params.get("limpio") !== "1") { try { db = JSON.parse(localStorage.getItem(key) || "{}"); } catch { db = {}; } }
  const subs = [];
  const save = () => { try { localStorage.setItem(key, JSON.stringify(db)); } catch { } };
  const cut = (col, p) => p.startsWith(col + "/") && p.slice(col.length + 1).indexOf("/") < 0;
  const lista = (col, o) => {
    let arr = Object.entries(db).filter(([p]) => cut(col, p)).map(([p, d]) => ({ id: p.slice(col.length + 1), ...clone(d) }));
    if (o?.orden) arr.sort((a, b) => (String(b[o.orden]) > String(a[o.orden]) ? 1 : -1) * (o.desc ? 1 : -1));
    if (o?.limite) arr = arr.slice(0, o.limite);
    return arr;
  };
  const avisar = () => subs.forEach(s => s.cb(lista(s.col, s.o)));
  const nuevoId = () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  if (!Object.keys(db).length) {   // datos de demostración
    const hoy = new Date().toISOString();
    Object.assign(db, {
      "usuarios/u1": { nombre: "Cindy (demo)", email: "cindy@demo.local", rol: "admin", activo: true },
      "usuarios/u2": { nombre: "Administradora (demo)", email: "admin@demo.local", rol: "cajero", activo: true },
      "usuarios/u3": { nombre: "Cocina (demo)", email: "cocina@demo.local", rol: "cocina", activo: true },
      "insumos/i1": { nombre: "MAGGI", unidad: "g", stock: 1600, stock_minimo: 0 },
      "insumos/i2": { nombre: "Sal", unidad: "kg", stock: 5, stock_minimo: 1 },
      "insumos/i3": { nombre: "CARNE DE HAMBURGUESA", unidad: "und", stock: 40, stock_minimo: 10 },
      "insumos/i4": { nombre: "Pan hamburguesa", unidad: "und", stock: 120, stock_minimo: 30 },
      "movimientos/m0": { insumo_id: "i1", insumo_nombre: "MAGGI", tipo: "entrada", cantidad: 1600, motivo: "Carga inicial", stock_resultante: 1600, usuario_nombre: "Cindy (demo)", fecha: hoy },
    });
    save();
  }
  return {
    modo: "memoria",
    now: () => new Date().toISOString(),
    newId: () => nuevoId(),
    sub(col, cb, o) { const s = { col, cb, o }; subs.push(s); setTimeout(() => cb(lista(col, o)), 0); return () => subs.splice(subs.indexOf(s), 1); },
    async get(p) { return db[p] ? clone(db[p]) : null; },
    async batch(ops) {
      const ids = [];
      for (const o of ops) {
        if (o.op === "set") db[o.path] = o.merge ? { ...(db[o.path] || {}), ...clone(limpiar(o.data)) } : clone(limpiar(o.data));
        else if (o.op === "update") { if (!db[o.path]) throw Object.assign(new Error("No existe " + o.path), { code: "not-found" }); db[o.path] = { ...db[o.path], ...clone(limpiar(o.data)) }; }
        else if (o.op === "add") { const id = nuevoId(); db[o.col + "/" + id] = clone(limpiar(o.data)); ids.push(id); }
        else if (o.op === "delete") delete db[o.path];
      }
      save(); avisar(); return ids;
    },
    async tx(fn) {
      const copia = clone(db), ids = [];
      try {
        const r = await fn({
          get: async p => (db[p] ? clone(db[p]) : null),
          set: (p, d, merge) => { db[p] = merge ? { ...(db[p] || {}), ...clone(limpiar(d)) } : clone(limpiar(d)); },
          update: (p, d) => { db[p] = { ...(db[p] || {}), ...clone(limpiar(d)) }; },
          add: (col, d) => { const id = nuevoId(); db[col + "/" + id] = clone(limpiar(d)); ids.push(id); return id; },
        });
        save(); avisar(); return r;
      } catch (e) { db = copia; throw e; }
    },
  };
}

async function crearFirestore() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{ initializeApp }, A, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
  const app = initializeApp(FB_CONFIG), authx = A.getAuth(app), db = F.getFirestore(app);
  const seg = p => p.split("/");
  const colRef = col => F.collection(db, "negocios", NEG, ...seg(col));
  const docRef = p => F.doc(db, "negocios", NEG, ...seg(p));
  const st = {
    modo: "firestore",
    now: () => F.serverTimestamp(),
    newId: col => F.doc(colRef(col)).id,
    sub(col, cb, o) {
      const q = o?.orden ? F.query(colRef(col), F.orderBy(o.orden, o.desc ? "desc" : "asc"), ...(o.limite ? [F.limit(o.limite)] : [])) : colRef(col);
      return F.onSnapshot(q, s => { st.estado[col] = { ok: true }; cb(s.docs.map(d => ({ id: d.id, ...d.data() }))); },
        e => { st.estado[col] = { ok: false, code: e.code || e.message }; st.onError?.(col, e); cb([]); });
    },
    estado: {},
    async get(p) { const s = await F.getDoc(docRef(p)); return s.exists() ? s.data() : null; },
    async batch(ops) {
      const ids = [];
      for (let i = 0; i < ops.length; i += 400) {
        const b = F.writeBatch(db);
        for (const o of ops.slice(i, i + 400)) {
          if (o.op === "set") b.set(docRef(o.path), limpiar(o.data), o.merge ? { merge: true } : {});
          else if (o.op === "update") b.update(docRef(o.path), limpiar(o.data));
          else if (o.op === "add") { const r = F.doc(colRef(o.col)); b.set(r, limpiar(o.data)); ids.push(r.id); }
          else if (o.op === "delete") b.delete(docRef(o.path));
        }
        await b.commit();
      }
      return ids;
    },
    tx: fn => F.runTransaction(db, async t => fn({
      get: async p => { const s = await t.get(docRef(p)); return s.exists() ? s.data() : null; },
      set: (p, d, merge) => t.set(docRef(p), limpiar(d), merge ? { merge: true } : {}),
      update: (p, d) => t.update(docRef(p), limpiar(d)),
      add: (col, d) => { const r = F.doc(colRef(col)); t.set(r, limpiar(d)); return r.id; },
    })),
  };
  const auth = {
    login: (e, p) => A.signInWithEmailAndPassword(authx, e, p),
    logout: () => A.signOut(authx),
    reset: e => A.sendPasswordResetEmail(authx, e),
    onChange: cb => A.onAuthStateChanged(authx, cb),
    // Crea la cuenta con una segunda instancia de la app, para no cerrar la sesión de quien la crea (igual que el POS).
    crearUsuario: async (email, pass) => {
      const sec = initializeApp(FB_CONFIG, "secundaria-" + Date.now()), a = A.getAuth(sec);
      try { return (await A.createUserWithEmailAndPassword(a, email, pass)).user.uid; }
      finally { try { await A.signOut(a); } catch { } }
    },
  };
  return { st, auth };
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let val;
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") val = v;
    else if (["checked", "disabled", "selected", "hidden", "readOnly"].includes(k)) el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  if (val !== undefined) el.value = val;
  return el;
}

// ───────── mínimo sugerido a partir del historial de conteos (solo sugiere: tú decides)
const fechaLocalDe = x => { const d = aFecha(x); return d ? `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}` : ""; };
function analizarConsumo(id) {
  const ls = S.lineas.filter(l => l.ficha_id === id).sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
  const recibidos = S.pedidos.filter(p => p.estado === "recibido" && (p.lineas || []).some(l => l.insumo_id === id))
    .map(p => fechaLocalDe([...(p.eventos || [])].reverse().find(e => e.estado === "recibido")?.fecha)).filter(Boolean);
  let total = 0, dias = 0, n = 0, max = 0;
  for (let i = 1; i < ls.length; i++) {
    const a = ls[i - 1], b = ls[i], d = diasEntre(b.fecha, a.fecha);
    if (d <= 0) continue;
    if (recibidos.some(x => x > a.fecha && x <= b.fecha)) continue;        // llegó mercancía en medio: no sirve para medir consumo
    const baja = a.cantidad - b.cantidad;
    if (baja < 0) continue;                                              // subió: entró mercancía sin registrar
    total += baja; dias += d; n++; max = Math.max(max, baja / d);

}

// ajuste de inventario (movimiento nuevo y trazable; nunca se edita ni se borra uno anterior)
async function registrarAjuste(v, insumo, corrige) {
  let antes = 0, nuevo = 0;
  await store.tx(async t => {
    const cur = await t.get("insumos/" + insumo.id);
    if (!cur) throw new Error("El insumo ya no existe en el inventario.");
    antes = Number(cur.stock) || 0; nuevo = v.modo === "nueva" ? v.cantidad : antes + v.cantidad;
    if (nuevo < 0) throw new Error("La existencia no puede quedar negativa.");
    t.update("insumos/" + insumo.id, { stock: nuevo });
    const motivoTxt = v.nota ? `${v.motivo}: ${v.nota}` : v.motivo;
    const movId = t.add("movimientos", {
      insumo_id: insumo.id, insumo_nombre: cur.nombre, tipo: "ajuste", origen: "ajuste", cantidad: nuevo, delta: nuevo - antes, stock_anterior: antes, stock_resultante: nuevo,
      motivo: motivoTxt, motivo_ajuste: v.motivo, nota: v.nota || null, corrige_movimiento_id: corrige || null, fuente: "abastecimiento",
      usuario_uid: S.user.uid, usuario_nombre: S.user.nombre, fecha: store.now(),
    });
    t.add("abast_historial", {
      seccion: "inventarios", entidad_id: insumo.id, entidad_nombre: cur.nombre, accion: "ajuste", movimiento_id: movId,
      cambios: [{ campo: "Existencia (" + (cur.unidad || "") + ")", antes, despues: nuevo }], motivo: motivoTxt + (corrige ? " (corrige un ajuste anterior)" : ""),
      usuario_uid: S.user.uid, usuario_nombre: S.user.nombre, fecha: store.now(),
    });
  });
}

const SEED = () => JSON.parse($id("seed").textContent);

function planImportacion() {
  const seed = SEED(); const plan = { seed, cats: [], provs: [], fichas: [], recetas: [], insumosNuevos: 0, vinculados: 0, existentes: 0 };
  const catEx = new Set(S.categorias.map(c => NORM(c.nombre)));
  seed.categorias.forEach(c => { if (!catEx.has(NORM(c.nombre))) plan.cats.push({ ...c, id: store.newId("abast_categorias") }); });
  const provEx = new Set(S.proveedores.map(p => NORM(p.nombre)));
  seed.proveedores.forEach(p => { if (!provEx.has(NORM(p.nombre))) plan.provs.push({ ...p, id: store.newId("abast_proveedores") }); });
  const codigos = new Set(S.fichas.map(f => f.codigo).filter(Boolean)), nombres = new Set(S.fichas.map(f => NORM(f.nombre)));
  const usados = new Set(S.fichas.map(f => f.id));
  seed.fichas.forEach(f => {
    if (codigos.has(f.codigo) || nombres.has(NORM(f.nombre))) { plan.existentes++; return; }
    const ins = S.insumos.find(i => NORM(i.nombre) === NORM(f.nombre) && !usados.has(i.id));
    let id; if (ins) { id = ins.id; usados.add(id); plan.vinculados++; } else { id = store.newId("insumos"); plan.insumosNuevos++; }
    plan.fichas.push({ f, id, insumo: ins || null });
  });
  const recEx = new Set(S.recetas.map(r => r.codigo));
  seed.recetas.forEach(r => { if (!recEx.has(r.codigo)) plan.recetas.push({ r, id: store.newId("abast_recetas") }); });
  return plan;
}

// ═════════════ OPERACIÓN DIARIA: Conteo · Hoy (alertas y sugerencias) · Pedidos ═════════════
// Regla de fondo (Cindy): cada día se cuenta el inventario; al comparar lo contado con el stock de seguridad
// (mínimo / crítico / objetivo de «Inventarios») sale la sugerencia de pedido del día. Puede salir vacía.
const DIAS_TODOS = [1, 2, 3, 4, 5, 6, 7];
const pad2 = n => String(n).padStart(2, "0");
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const diaSemana = () => { const d = new Date().getDay(); return d === 0 ? 7 : d; };
const diasEntre = (a, b) => Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 864e5);
const horaCorta = iso => { const d = aFecha(iso); return d ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}` : ""; };
const fechaLarga = () => new Date().toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });
const cantTxt = (n, u) => `${fmtN(n)}${u ? " " + u : ""}`;

// "20+10" suma; acepta coma o punto decimal. null = vacío · NaN = inválido
function parseConteo(s) {
  const partes = String(s ?? "").split("+").map(x => x.trim()).filter(x => x !== "");
  if (!partes.length) return null;
  let t = 0;
  for (const p of partes) { const n = parseNum(p); if (n == null || isNaN(n)) return NaN; t += n; }
  return Math.round(t * 1000) / 1000;
}
// de la unidad de conteo a la del inventario (la del POS); null si falta el factor
function aUnidadInsumo(f, cant) {
  const ui = f.unidad_insumo || S.insumos.find(i => i.id === f.id)?.unidad;   // sin unidad propia: la del inventario
  if (!f.unidad_conteo || !ui) return null;
  const auto = convertir(cant, f.unidad_conteo, ui);
  if (auto != null) return auto;
  const k = f.factor_conteo;
  return (typeof k === "number" && !isNaN(k) && k > 0) ? Math.round(cant * k * 1000) / 1000 : null;
}
const tipoEfectivo = f => f.tipo || (f.regla?.proveedor_id ? "comprar" : null);

// ───────── cálculo: nivel, cantidad sugerida y agrupación
function nivelDe(f, stock) {
  const r = f.regla || {};
  if (stock == null) return "sin_dato";
  const min = r.minimo, crit = r.critico != null ? r.critico : (min != null ? min * (S.config.critico_defecto_pct ?? 50) / 100 : null);
  let n = "ok";
  if (min != null && stock <= min) n = "reponer";
  if (crit != null && stock <= crit) n = "critico";
  return n;
}
function cantidadSugerida(f, stock) {
  const r = f.regla || {};
  const modo = r.modo_cantidad || (r.objetivo != null ? "hasta_objetivo" : (r.cantidad_pedido != null ? "fija" : null));
  const unidad = r.unidad_pedido || f.unidad_conteo || "";
  const eq = r.equivalencia > 0 && r.unidad_pedido ? r.equivalencia : null;
  if (modo === "fija") return r.cantidad_pedido > 0 ? { cantidad: r.cantidad_pedido, unidad, modo, como: "cantidad fija" } : { falta: "Falta la cantidad fija a pedir" };
  if (modo === "hasta_objetivo") {
    if (r.objetivo == null) return { falta: "Falta el objetivo" };
    const falta = r.objetivo - stock;
    if (falta <= 0) return { falta: "Ya está en o sobre el objetivo" };
    const cantidad = eq ? Math.ceil(falta / eq - 1e-9) : Math.ceil(falta * 100 - 1e-9) / 100;
    return { cantidad, unidad, modo, como: `hasta el objetivo (${fmtN(r.objetivo)})` };
  }
  return { falta: "Define cómo calcular la cantidad (fija u objetivo) en Inventarios" };
}
function pedidosAbiertos() {   // producto → pedido que ya lo tiene (en preparación o en tránsito)
  const est = new Set([...(S.config.estados_en_transito || []), ...(S.config.estados_en_preparacion || [])]);
  const m = new Map();
  for (const p of S.pedidos) if (est.has(p.estado)) for (const l of p.lineas || []) if (!m.has(l.insumo_id)) m.set(l.insumo_id, p);
  return m;
}
function calcularHoy() {
  const hoy = hoyISO(), dia = diaSemana();
  const ult = new Map();
  for (const l of S.lineas) { const p = ult.get(l.ficha_id); if (!p || l.fecha > p.fecha || (l.fecha === p.fecha && (l.hora || "") > (p.hora || ""))) ult.set(l.ficha_id, l); }
  const bloq = pedidosAbiertos(), recib = new Map();   // producto → cuándo se recibió su último pedido
  for (const p of S.pedidos) if (p.estado === "recibido") { const t = [...(p.eventos || [])].reverse().find(e => e.estado === "recibido")?.fecha || ""; for (const l of p.lineas || []) if (t > (recib.get(l.insumo_id) || "")) recib.set(l.insumo_id, t); }
  const activas = S.fichas.filter(f => f.activo !== false && f.gestionar !== "no");
  const paraContar = activas.filter(f => f.cuenta !== "no" && (f.dias_conteo?.length ? f.dias_conteo : DIAS_TODOS).includes(dia));
  const contados = paraContar.filter(f => ult.get(f.id)?.fecha === hoy);
  const out = { hoy, ult, paraContar, contados, sinContar: paraContar.filter(f => ult.get(f.id)?.fecha !== hoy), proveedores: new Map(), preparar: [], revisar: [], yaPedidos: [], incluidos: [], recibidos: [], criticos: 0, total: 0 };
  for (const f of activas) {
    const r = f.regla || {};
    if (r.minimo == null && r.critico == null) continue;
    const ln = ult.get(f.id); if (!ln) continue;
    const nivel = nivelDe(f, ln.cantidad);
    if (nivel === "ok" || nivel === "sin_dato") continue;
    const it = { f, ln, stock: ln.cantidad, nivel, min: r.minimo, viejo: ln.fecha !== hoy, dias: diasEntre(hoy, ln.fecha), tipo: tipoEfectivo(f) };
    out.total++; if (nivel === "critico") out.criticos++;
    const abierto = bloq.get(f.id);
    if (abierto) { it.pedido = abierto; out.yaPedidos.push(it); continue; }
    if ((recib.get(f.id) || "") > (ln.hora || "")) { out.recibidos.push(it); continue; }   // llegó mercancía después del último conteo: hay que recontar
    if (it.tipo === "comprar") {
      if (r.incluido_en_id) { it.incluidoEn = nombreFicha(r.incluido_en_id); out.incluidos.push(it); continue; }
      it.sug = cantidadSugerida(f, ln.cantidad);
      const k = r.proveedor_id || "_sin";
      if (!out.proveedores.has(k)) out.proveedores.set(k, []);
      out.proveedores.get(k).push(it);
    } else if (it.tipo === "producir") out.preparar.push(it);
    else out.revisar.push(it);
  }
  const rank = it => (it.nivel === "critico" ? 0 : 1);
  const ord = (a, b) => rank(a) - rank(b) || (a.f.orden || 0) - (b.f.orden || 0);
  out.proveedores.forEach(a => a.sort(ord)); out.preparar.sort(ord); out.revisar.sort(ord);
  return out;
}

// ───────── guardar un conteo (actualiza la existencia del inventario y deja su movimiento)
async function guardarConteo(f, cant) {
  const fecha = hoyISO(), conv = aUnidadInsumo(f, cant), idLinea = "abast_conteo_lineas/" + fecha + "_" + f.id;
  const linea = { fecha, ficha_id: f.id, nombre: f.nombre, cantidad: cant, unidad_conteo: f.unidad_conteo || null, cantidad_insumo: conv, actualiza_stock: false,
    usuario_uid: S.user.uid, usuario_nombre: S.user.nombre, hora: new Date().toISOString() };
  await store.tx(async t => {
    const ins = await t.get("insumos/" + f.id), previa = await t.get(idLinea);
    if (ins && conv != null) {
      const antes = Number(ins.stock) || 0;
      t.update("insumos/" + f.id, { stock: conv });
      const movId = t.add("movimientos", { insumo_id: f.id, insumo_nombre: ins.nombre, tipo: "ajuste", origen: "conteo", cantidad: conv, delta: Math.round((conv - antes) * 1000) / 1000, stock_anterior: antes, stock_resultante: conv,
        motivo: "Conteo físico", fuente: "abastecimiento", usuario_uid: S.user.uid, usuario_nombre: S.user.nombre, fecha: store.now() });
      linea.actualiza_stock = true; linea.movimiento_id = movId;
      // si se recuenta el mismo día, se conserva cómo estaba el inventario ANTES del primer conteo del día
      linea.stock_anterior = previa && !previa.anulado && previa.stock_anterior != null ? previa.stock_anterior : antes;
    }
    t.set(idLinea, linea);
  });
  return linea;
}
// Anula el conteo de hoy de un producto: la línea queda marcada (no se borra), el inventario vuelve a como estaba y queda un movimiento.
async function anularConteo(f) {
  const idLinea = "abast_conteo_lineas/" + hoyISO() + "_" + f.id; let revertido = false;
  await store.tx(async t => {
    const ln = await t.get(idLinea);
    if (!ln || ln.anulado) throw new Error("Ese conteo ya no existe.");
    const ins = await t.get("insumos/" + f.id);
    if (ins && ln.actualiza_stock && ln.stock_anterior != null && ln.cantidad_insumo != null) {
      const actual = Number(ins.stock) || 0, nuevo = Math.max(0, Math.round((actual - (ln.cantidad_insumo - ln.stock_anterior)) * 1000) / 1000);
      t.update("insumos/" + f.id, { stock: nuevo });
      t.add("movimientos", { insumo_id: f.id, insumo_nombre: ins.nombre, tipo: "ajuste", origen: "conteo", cantidad: nuevo, delta: Math.round((nuevo - actual) * 1000) / 1000, stock_anterior: actual, stock_resultante: nuevo,
        motivo: "Conteo anulado", fuente: "abastecimiento", usuario_uid: S.user.uid, usuario_nombre: S.user.nombre, fecha: store.now() });
      revertido = true;
    }
    t.set(idLinea, { ...ln, anulado: true, anulado_por_uid: S.user.uid, anulado_por: S.user.nombre, anulado_en: new Date().toISOString(), stock_revertido: revertido });
  });
  return revertido;
}

// ═══════════ CONTEO ═══════════
function montarConteo(main) {

      if (!confirm(`¿Quitar el conteo de hoy de «${f.nombre}» (${fmtN(ln.cantidad)})?\n\n${aviso}\nQueda registrado en los movimientos.`)) { pintarFila(ref); return; }

    unidad.textContent = f.unidad_conteo || "sin unidad";
    ref.el = h("div", { class: "item cnt-row", style: "cursor:default" },
      h("div", { class: "main" }, h("div", { class: "name" }, f.nombre, " ", nivel), h("div", { class: "small mute", title: f.nota || "" }, [f.regla?.minimo != null ? "Mín " + fmtN(f.regla.minimo) : null, f.nota ? (f.nota.length > 90 ? f.nota.slice(0, 90) + "…" : f.nota) : null].filter(Boolean).join(" · ")), estado, ref.btnQuitar),
